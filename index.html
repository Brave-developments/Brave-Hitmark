<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hitmarker UI</title>
        <script>
            const audioPlayers = new Map();

            function getAudioPlayer(name) {
                if (!audioPlayers.has(name)) {
                    const audio = new Audio(`sounds/${name}.ogg`);
                    audio.preload = 'auto';
                    audioPlayers.set(name, audio);
                }

                return audioPlayers.get(name);
            }

            window.addEventListener('message', function(event) {
                const data = event.data || {};

                if (data.transactionType === 'playSound' && data.transactionFile) {
                    const audioPlayer = getAudioPlayer(data.transactionFile);
                    audioPlayer.pause();
                    audioPlayer.currentTime = 0;
                    audioPlayer.volume = Number(data.transactionVolume) || 1.0;
                    audioPlayer.play().catch(function() {});
                }
            });
        </script>
    </head>
    <body>
        <!-- Hitmarker UI content will be handled by FiveM -->
    </body>
</html>
